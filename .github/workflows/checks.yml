name: checks

on:
  pull_request:
    paths: ["services/**", "meta/**", "scripts/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate service files
        run: python3 scripts/fet.py validate
      - name: Check README builds
        run: python3 scripts/fet.py build
      - name: Check evidence for added or changed services
        env:
          BASE_REF: ${{ github.base_ref }}
          MANUAL_OK: ${{ contains(github.event.pull_request.labels.*.name, 'evidence-manual-ok') }}
        run: |
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- 'services/*.yaml')
          if [ -z "$files" ]; then echo "No added or changed service files."; exit 0; fi
          if python3 scripts/fet.py evidence $files; then exit 0; fi
          if [ "$MANUAL_OK" = "true" ]; then
            echo "::warning::Evidence check failed, but a maintainer confirmed it by hand (evidence-manual-ok)."
            exit 0
          fi
          exit 1
