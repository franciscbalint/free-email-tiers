name: rebuild README

on:
  push:
    branches: [main]
    paths: ["services/**", "meta/**", "scripts/**"]
  workflow_dispatch:

# Pushes with the README_BOT_KEY deploy key, which is allowed past the main-branch rules.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.README_BOT_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/fet.py build
      - name: Commit README if it changed
        run: |
          if git diff --quiet README.md; then echo "README unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild README" -- README.md
          git push
